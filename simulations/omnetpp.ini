# ============================================================
# SMOKE V3 UNIQUEMENT (temps courts). Ne pas utiliser pour la campagne.
# Campagne finale : attackStart=360s attackEnd=1440s sim-time-limit=1800s
# ============================================================
[Config SmokeReplay]
description = "TEST V3 Replay attackStart=20s attackEnd=100s"
extends = Replay
sim-time-limit = 120s
**.loRaNode*.app[0].timeToFirstPacket = exponential(2s)
**.loRaNode*.app[0].timeToNextPacket = exponential(6s)
**.loRaNode*.app[0].initialLoRaSF = 7
**.replayer.app[0].initialLoRaSF = 7
**.replayer.app[0].attackStart = 20s
**.replayer.app[0].attackEnd = 100s
**.replayer.app[0].timeToReplay = uniform(1s, 3s)

[Config SmokeWormhole]
description = "TEST V3 Wormhole attackStart=20s attackEnd=100s"
extends = Wormhole
sim-time-limit = 120s
**.loRaNode*.app[0].timeToFirstPacket = exponential(2s)
**.loRaNode*.app[0].timeToNextPacket = exponential(6s)
**.loRaNode*.app[0].initialLoRaSF = 7
**.wormholeA.app[0].initialLoRaSF = 7
**.wormholeB.app[0].initialLoRaSF = 7
**.wormholeA.app[0].attackStart = 20s
**.wormholeA.app[0].attackEnd = 100s
**.wormholeB.app[0].attackStart = 20s
**.wormholeB.app[0].attackEnd = 100s
**.wormholeA.app[0].tunnelDelay = uniform(0.05s, 1s)

[Config SmokeJamming]
description = "TEST V3 Jamming attackStart=20s attackEnd=100s"
extends = Jamming
sim-time-limit = 120s
**.loRaNode*.app[0].timeToFirstPacket = exponential(2s)
**.loRaNode*.app[0].timeToNextPacket = exponential(6s)
**.loRaNode*.app[0].initialLoRaSF = 7
**.jammer.app[0].initialLoRaSF = 7
**.jammer.app[0].attackStart = 20s
**.jammer.app[0].attackEnd = 100s
**.jammer.app[0].timeToFirstPacket = 0s

