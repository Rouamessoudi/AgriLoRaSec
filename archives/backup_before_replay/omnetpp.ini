[General]
# ============================================================
# AgriLoRaSec
# 10 noeuds LoRa x 3 capteurs + attaques (jamming / replay / wormhole)
# ============================================================

network = agrilorasec.simulations.AgriLoRaNetwork

**.maxTransmissionDuration = 4s
**.energyDetection = -110dBm
**.vector-recording = true

rng-class = "cMersenneTwister"

# --- Gateway -> Network Server ---
**.loRaGW[*].numUdpApps = 1
**.loRaGW[0].packetForwarder.localPort = 2000
**.loRaGW[0].packetForwarder.destPort = 1000
**.loRaGW[0].packetForwarder.destAddresses = "networkServer"
**.loRaGW[0].packetForwarder.indexNumber = 0

# --- Network Server ---
**.networkServer.numApps = 1
**.networkServer.**.evaluateADRinServer = true
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].destAddresses = "loRaGW[0]"
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].localPort = 1000
**.networkServer.app[0].adrMethod = ${"avg"}

# --- Simulation ---
**.numberOfPacketsToSend = 0
sim-time-limit = 30min
simtime-resolution = -11
repeat = 1

# Intervalle des capteurs agricoles (noeuds legitimes)
**.loRaNode*.app[0].timeToFirstPacket = exponential(50s)
**.loRaNode*.app[0].timeToNextPacket = exponential(50s)
**.alohaChannelModel = false

# ============================================================
# 10 NOEUDS + JAMMER + REPLAYER + WORMHOLE
# ============================================================
**.numberOfNodes = 10
**.numberOfGateways = 1
**.sensorsPerNode = 3

**.constraintAreaMaxX = 1000m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 0m

**.loRaNode0.**.initFromDisplayString = true
**.loRaNode1.**.initFromDisplayString = true
**.loRaNode2.**.initFromDisplayString = true
**.loRaNode3.**.initFromDisplayString = true
**.loRaNode4.**.initFromDisplayString = true
**.loRaNode5.**.initFromDisplayString = true
**.loRaNode6.**.initFromDisplayString = true
**.loRaNode7.**.initFromDisplayString = true
**.loRaNode8.**.initFromDisplayString = true
**.loRaNode9.**.initFromDisplayString = true
**.jammer.**.initFromDisplayString = true
**.replayer.**.initFromDisplayString = true
**.wormholeA.**.initFromDisplayString = true
**.wormholeB.**.initFromDisplayString = true
**.loRaGW[*].**.initFromDisplayString = true

# Capteurs agricoles legitimes
# SF par defaut (Qtenv). La dataset ML fait varier SF=7..12 via generate_packet_dataset.py
# pour TOUS les scenarios (meme liste), sans lier un SF a une attaque.
**.loRaNode*.**initialLoRaSF = 12
**.loRaNode*.**initialLoRaTP = 14dBm
**.loRaNode*.**initialLoRaBW = 125 kHz
**.loRaNode*.**initialLoRaCR = 4
**.loRaNode*.**.evaluateADRinNode = false
**.loRaNode*.numApps = 1
**.loRaNode*.app[0].typename = "agrilorasec.AgriSensorApp"

# Jammer / Replayer : desactives par defaut (Config NoAttack)
**.jammer.numApps = 0
**.jammer.**initialLoRaSF = 12
**.jammer.**initialLoRaTP = 14dBm
**.jammer.**initialLoRaBW = 125 kHz
**.jammer.**initialLoRaCR = 4

**.replayer.numApps = 0
**.replayer.**initialLoRaSF = 12
**.replayer.**initialLoRaTP = 14dBm
**.replayer.**initialLoRaBW = 125 kHz
**.replayer.**initialLoRaCR = 4

**.wormholeA.numApps = 0
**.wormholeB.numApps = 0
**.wormholeA.**initialLoRaSF = 12
**.wormholeB.**initialLoRaSF = 12
**.wormholeA.**initialLoRaTP = 14dBm
**.wormholeB.**initialLoRaTP = 14dBm
**.wormholeA.**initialLoRaBW = 125 kHz
**.wormholeB.**initialLoRaBW = 125 kHz
**.wormholeA.**initialLoRaCR = 4
**.wormholeB.**initialLoRaCR = 4

# --- Gateway ---
**.LoRaGWNic.radio.iAmGateway = true
# Journal paquet/ligne : AgriLoRaGW utilise LoggingPacketForwarder (FLoRa LoRaGW a un type fixe)
**.packetEventLogger.outputFile = "results/packet_events.csv"

# --- Energie ---
**.loRaNode*.LoRaNic.radio.energyConsumer.typename = "agrilorasec.LoggingLoRaEnergyConsumer"
**.loRaNode*.**.energySourceModule = "^.IdealEpEnergyStorage"
**.loRaNode*.LoRaNic.radio.energyConsumer.configFile = xmldoc("energyConsumptionParameters.xml")
**.jammer.LoRaNic.radio.energyConsumer.typename = "agrilorasec.LoggingLoRaEnergyConsumer"
**.jammer.**.energySourceModule = "^.IdealEpEnergyStorage"
**.jammer.LoRaNic.radio.energyConsumer.configFile = xmldoc("energyConsumptionParameters.xml")
**.replayer.LoRaNic.radio.energyConsumer.typename = "agrilorasec.LoggingLoRaEnergyConsumer"
**.replayer.**.energySourceModule = "^.IdealEpEnergyStorage"
**.replayer.LoRaNic.radio.energyConsumer.configFile = xmldoc("energyConsumptionParameters.xml")
**.wormholeA.LoRaNic.radio.energyConsumer.typename = "agrilorasec.LoggingLoRaEnergyConsumer"
**.wormholeA.**.energySourceModule = "^.IdealEpEnergyStorage"
**.wormholeA.LoRaNic.radio.energyConsumer.configFile = xmldoc("energyConsumptionParameters.xml")
**.wormholeB.LoRaNic.radio.energyConsumer.typename = "agrilorasec.LoggingLoRaEnergyConsumer"
**.wormholeB.**.energySourceModule = "^.IdealEpEnergyStorage"
**.wormholeB.LoRaNic.radio.energyConsumer.configFile = xmldoc("energyConsumptionParameters.xml")

# --- Canal radio LoRa ---
**.sigma = 3.57
AgriLoRaNetwork.**.radio.separateTransmissionParts = false
AgriLoRaNetwork.**.radio.separateReceptionParts = false
**.ipv4Delayer.config = xmldoc("cloudDelays.xml")
**.radio.radioMediumModule = "LoRaMedium"
**.LoRaMedium.pathLossType = "LoRaLogNormalShadowing"
**.minInterferenceTime = 0s
**.displayAddresses = false

**.LoRaMedium.mediumLimitCacheType = "LoRaMediumCache"
**.LoRaMedium.rangeFilter = "communicationRange"
**.LoRaMedium.neighborCacheType = "LoRaNeighborCache"
**.LoRaMedium.neighborCache.range = 546m
**.LoRaMedium.neighborCache.refillPeriod = 3000s

# ============================================================
# Configurations : sans attaque / jamming / replay / wormhole
# ============================================================

[Config NoAttack]
description = "Reseau sain sans attaque"
**.jammer.numApps = 0
**.replayer.numApps = 0
**.wormholeA.numApps = 0
**.wormholeB.numApps = 0

[Config Jamming]
description = "Attaque jamming active"
**.jammer.numApps = 1
**.replayer.numApps = 0
**.wormholeA.numApps = 0
**.wormholeB.numApps = 0
**.jammer.app[0].typename = "agrilorasec.JammerApp"
**.jammer.app[0].timeToFirstPacket = 1s
**.jammer.app[0].timeToNextPacket = 0.05s
**.jammer.app[0].initialLoRaSF = 12
**.jammer.app[0].initialLoRaTP = 14dBm
**.jammer.app[0].initialLoRaBW = 125 kHz
**.jammer.app[0].initialLoRaCR = 4
**.jammer.app[0].numberOfPacketsToSend = 0

[Config Replay]
description = "Attaque replay active"
**.jammer.numApps = 0
**.replayer.numApps = 1
**.wormholeA.numApps = 0
**.wormholeB.numApps = 0
**.replayer.app[0].typename = "agrilorasec.ReplayApp"
**.replayer.app[0].timeToCapture = 5s
**.replayer.app[0].timeToReplay = 10s
**.replayer.app[0].numberOfReplays = 3
**.replayer.app[0].initialLoRaSF = 12
**.replayer.app[0].initialLoRaTP = 14dBm
**.replayer.app[0].initialLoRaBW = 125 kHz
**.replayer.app[0].initialLoRaCR = 4

[Config Wormhole]
description = "Attaque wormhole active (tunnel A -> B)"
**.jammer.numApps = 0
**.replayer.numApps = 0
**.wormholeA.numApps = 1
**.wormholeB.numApps = 1
**.wormholeA.app[0].typename = "agrilorasec.WormholeApp"
**.wormholeB.app[0].typename = "agrilorasec.WormholeApp"
**.wormholeA.app[0].role = "entry"
**.wormholeB.app[0].role = "exit"
**.wormholeA.app[0].peerAppPath = "AgriLoRaNetwork.wormholeB.app[0]"
**.wormholeA.app[0].timeToCapture = 5s
**.wormholeA.app[0].numberOfForwards = 3
**.wormholeA.app[0].initialLoRaSF = 12
**.wormholeB.app[0].initialLoRaSF = 12
**.wormholeA.app[0].initialLoRaTP = 14dBm
**.wormholeB.app[0].initialLoRaTP = 14dBm
**.wormholeA.app[0].initialLoRaBW = 125 kHz
**.wormholeB.app[0].initialLoRaBW = 125 kHz
**.wormholeA.app[0].initialLoRaCR = 4
**.wormholeB.app[0].initialLoRaCR = 4

# ============================================================
# Scalabilite 20 noeuds (reseau AgriLoRaNetwork20, sans toucher au 10 noeuds)
# ============================================================
[Config Nodes20]
description = "Parametres communs 20 noeuds (ne pas lancer seul)"
network = agrilorasec.simulations.AgriLoRaNetwork20
**.numberOfNodes = 20
**.loRaNode10.**.initFromDisplayString = true
**.loRaNode11.**.initFromDisplayString = true
**.loRaNode12.**.initFromDisplayString = true
**.loRaNode13.**.initFromDisplayString = true
**.loRaNode14.**.initFromDisplayString = true
**.loRaNode15.**.initFromDisplayString = true
**.loRaNode16.**.initFromDisplayString = true
**.loRaNode17.**.initFromDisplayString = true
**.loRaNode18.**.initFromDisplayString = true
**.loRaNode19.**.initFromDisplayString = true

[Config NoAttack20]
description = "20 noeuds, reseau sain"
extends = NoAttack, Nodes20

[Config Jamming20]
description = "20 noeuds, attaque jamming"
extends = Jamming, Nodes20

[Config Replay20]
description = "20 noeuds, attaque replay"
extends = Replay, Nodes20

[Config Wormhole20]
description = "20 noeuds, attaque wormhole"
extends = Wormhole, Nodes20
**.wormholeA.app[0].peerAppPath = "AgriLoRaNetwork20.wormholeB.app[0]"
